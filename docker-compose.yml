services:
    biogaze:
        image: lucascoderhub/biogaze-api:latest
        container_name: biogaze-api
        deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: all
                  capabilities: [gpu]
        environment:
            # BioGaze
            BIOGAZE_API_KEY: ${BIOGAZE_API_KEY}
            EARLY_STOP_ENABLED: ${EARLY_STOP_ENABLED}
            MIN_WIDTH: ${MIN_WIDTH}
            MIN_HEIGHT: ${MIN_HEIGHT}
            ASPECT_RATIO: ${ASPECT_RATIO}
            SKIP_RESOLUTION_CHECK: ${SKIP_RESOLUTION_CHECK}
            SKIP_RATIO_CHECK: ${SKIP_RATIO_CHECK}
            # Database
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            # VLM
            VLM_ENABLED: ${VLM_ENABLED}
            VLM_ENDPOINT: ${VLM_ENDPOINT}
            VLM_API_KEY: ${VLM_API_KEY}
            VLM_MODEL_NAME: ${VLM_MODEL_NAME}
            VLM_REQUEST_TIMEOUT: ${VLM_REQUEST_TIMEOUT}
            VLM_MAX_TOKENS: ${VLM_MAX_TOKENS}
            VLM_TEMPERATURE: ${VLM_TEMPERATURE}
            VLM_MAX_CONCURRENCY: ${VLM_MAX_CONCURRENCY}

        volumes:
            # Model checkpoints
            - ./dlib_checkpoint:/app/gaze_estimation/modules/dlib_checkpoint
            - ./face_parser_cp:/app/face_parser/res/cp
            - ./gaze_estimation_cp:/app/gaze_estimation/ckpt
            - ./detectors_yolo:/app/detectors/models
            # Inputs/Outputs
            - ./input_images:/app/input_images:ro
            - ./temp_uploads:/app/temp_uploads
            - ./audit_storage:/app/audit_storage
        networks:
            - vllm-net
        ports:
            - "${BIOGAZE_PORT}:8000"
        extra_hosts:
          - "host.docker.internal:host-gateway"
networks:
    vllm-net:
        external: true
